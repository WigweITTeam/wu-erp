services:
  # ERP Frontend (Angular + Nginx)
  erp-frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.nginx
    container_name: erp-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      erp-backend:
        condition: service_started
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ERP Backend (.NET API)
  erp-backend:
    build:
      context: ../../ERP-BACKEND
      dockerfile: Dockerfile
    container_name: erp-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=WUIAMDb;User=sa;Password=WU-2025,dfh;TrustServerCertificate=True;Encrypt=False;
    networks:
      - erp-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  erp-network:
    driver: bridge
